services:
  db:
    image: postgres:16-alpine
    container_name: diabetes_personal_demo_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-diabetes_demo}
    ports:
      - "5432:5432"
    volumes:
      - postgres_personal_demo_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-diabetes_demo}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: development
    container_name: diabetes_personal_demo_backend_dev
    restart: unless-stopped
    ports:
      - "5001:5001"
    volumes:
      - ./backend:/app
    environment:
      FLASK_DEBUG: 1
      DEMO_MODE: "true"
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-secret-key-for-local-docker}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-diabetes_demo}
      DB_AUTO_CREATE: "true"
      SEED_DEMO_DATA: "true"
      RULES_SEED_VERSION: "v3"
      DB_FALLBACK_ENABLED: "false"
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: development
    container_name: diabetes_personal_demo_frontend_dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: "http://localhost:5001/api"
      VITE_DEMO_MODE: "true"
      VITE_DEMO_LABEL: "Independent Demo"
    depends_on:
      - backend

  # Optional database GUI. Start it with: docker compose --profile tools up -d pgadmin
  # Then open http://localhost:5050 (login with PGADMIN_EMAIL / PGADMIN_PASSWORD).
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: diabetes_personal_demo_pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin_personal_demo_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_personal_demo_dev_data:
  pgadmin_personal_demo_data:
